name: Main Procedure Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Show project files
        run: |
          echo "Repository root: $(pwd)"
          echo "Files in repository root:"
          ls -la
          test -f requirements.txt
          test -f main.py
          test -f mec_side.py
          test -f user_side.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt is empty or only contains comments; no external dependencies to install."
          fi

      - name: Syntax check
        run: |
          python -m py_compile main.py mec_side.py user_side.py

      - name: Run main simulation and save visible output
        run: |
          set -o pipefail
          mkdir -p reports
          echo "Running main.py..."
          PYTHONUNBUFFERED=1 python main.py 2>&1 | tee reports/run-output.txt

      - name: Add simulation output to GitHub Actions summary
        if: always()
        run: |
          {
            echo "# Simulation Run Output"
            echo ""
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Job: $GITHUB_JOB"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run number: $GITHUB_RUN_NUMBER"
            echo ""
            echo "## Console output"
            echo ""
            echo '```text'
            if [ -f reports/run-output.txt ]; then
              cat reports/run-output.txt
            else
              echo "reports/run-output.txt was not created. Check the previous step logs."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulation output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-run-output-${{github.run_number}}
          path: reports/run-output.txt
          if-no-files-found: warn
